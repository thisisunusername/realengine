<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="RealEngine">
  <title>RealEngine</title>
  <desc>A hash mark on a dark rounded square: the RealEngine logo.</desc>

  <defs>
    <linearGradient id="bg" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="512" y2="512">
      <stop offset="0%"   stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#1c2128"/>
    </linearGradient>
    <linearGradient id="hashv" gradientUnits="userSpaceOnUse" x1="0" y1="60" x2="0" y2="452">
      <stop offset="0%"   stop-color="#7ee787"/>
      <stop offset="50%"  stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#a371f7"/>
    </linearGradient>
    <linearGradient id="hashh" gradientUnits="userSpaceOnUse" x1="90" y1="0" x2="422" y2="0">
      <stop offset="0%"   stop-color="#7ee787"/>
      <stop offset="50%"  stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#a371f7"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="512" height="512" rx="104" ry="104" fill="url(#bg)"/>

  <g stroke-width="58" stroke-linecap="round" fill="none">
    <line x1="210" y1="96"  x2="182" y2="416" stroke="url(#hashv)"/>
    <line x1="330" y1="96"  x2="302" y2="416" stroke="url(#hashv)"/>
    <line x1="104" y1="202" x2="408" y2="202" stroke="url(#hashh)"/>
    <line x1="104" y1="310" x2="408" y2="310" stroke="url(#hashh)"/>
  </g>
</svg>